matching_contract: {"operators":["equals_ci"],"normalization":"Compare full strings case-insensitively; preserve raw values. Do not trim, strip versions, tokenize, stem or apply substring matching implicitly.","unmatched":"UNMAPPED; never map unmatched software to Other / Shadow-IT.","ambiguous":"AMBIGUOUS; retain all candidate product IDs and require review; never choose first match silently.","aliases":"alternate_names are descriptive only and never automatically compiled as patterns.","nulls":"Missing, null and empty names remain unclassified; do not stringify them.","categories":"One primary category per product; secondary categories provide navigation and overlapping views, not extra installations.","production_gate":"No pattern becomes tenant-validated until actual display names, corroborating identity and controlled positive/negative fixtures are recorded."}
confidence_contract: "Qualitative name specificity only; neither detection sensitivity nor policy risk. No precision, recall or false-positive rate was measured."
policy_contract: "review_priority is unassigned until an organization supplies asset scope, business need, product/version, account/workspace, owner, decision, expiry and exceptions."
evidence_contract: "Each product reference was retrieval-attempted. Successful references support product-family context only; curated vendor labels and all inventory patterns require corroboration. Corporate review context is INFERRED governance guidance."
