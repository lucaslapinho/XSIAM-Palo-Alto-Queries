review_priority: POLICY_DEPENDENT_UNASSIGNED
corporate_relevance: Cross-category corporate software-inventory review; policy dependent
vendor_interpretation: Curated catalog brand/project; not reported publisher or verified legal entity
null_behavior: Exclude null/empty names; preserve null endpoint_name/platform/version on matching rows
system_fields: Non-excludable product system fields may appear if present; not relied upon
false_positives:
- Identical labels on spoofed, repackaged or unrelated software
- Approved installations are inventory matches; only an unsupported policy verdict would make them policy false
  positives
false_positive_considerations:
- Identical labels on spoofed, repackaged or unrelated software
- An approved installation is not an unauthorized-software verdict
false_negatives:
- Unlisted version/locale/edition/architecture/whitespace variants
- Portable, embedded, web-only, extension or unregistered packages absent from inventory
- Collection, access, retention and result-cap gaps
limitations:
- No identity, execution, session, current-installation, protection-health or compromise proof
- No unique endpoint or installation counts
- Primary category membership only; secondary roles do not duplicate products
prerequisites:
  build_license_identity_rbac_sbac: Unknown
  collection_retention_population: Unknown
  field_schema_types: Unknown
validation:
  S:
    result: NOT RUN
    scope: Complete query
    rationale: Independent controlled query evaluation not run; generator integrity checks are separate
  D:
    result: NOT RUN
    scope: Complete query
    rationale: No current source binds every material construct and field to one named release
  C:
    result: NOT RUN
    scope: Complete query
    rationale: No named tenant schema/compiler acceptance
  E:
    result: NOT RUN
    scope: Complete query
    rationale: No tenant query execution/results
claim_level_documentation: Individual sources/constructs have documented support with the scopes and retrieval gaps
  recorded in references; this is not complete-query D PASS
compiler_and_runtime_size: UNMEASURED; query length/stages and volume require bounded target checks
performance_and_accuracy: UNMEASURED; no precision/recall, resource or runtime claim
comment_compatibility: UNVERIFIED for exact target; no comments emitted
